name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-jpn
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  bot-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tegaru_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bot
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tegaru_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-jpn
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tegaru-bot bot
      - name: OCR inside image
        run: |
          docker run --rm -v "$PWD/bot/tests/fixtures:/fx:ro" tegaru-bot python -c "
          import receipt_ocr, datetime
          assert receipt_ocr.available(), 'tesseract jpn missing'
          r = receipt_ocr.read_receipt(open('/fx/taxi.jpg','rb').read(), datetime.date(2026,11,5))
          print(r)
          assert r['total'] == 3410, r
          "
      - name: App starts
        run: |
          docker run -d --name app -e PORT=10000 -p 10000:10000 tegaru-bot
          for i in $(seq 1 30); do curl -sf localhost:10000/ && break; sleep 1; done
          curl -sf localhost:10000/ | grep '"tesseract":true'
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: check:tax (vergi kartı ↔ bot/tax)
        run: npm run check:tax
      - name: check:legal (特商法・規約 sayfaları)
        run: npm run check:legal
      - name: check:team (ekip rolleri)
        run: npm run check:team
      - name: check:lp (tanıtım sayfası ↔ bot/billing.py)
        run: npm run check:lp
      - name: check:welcome (初期設定ウィザード)
        run: npm run check:welcome

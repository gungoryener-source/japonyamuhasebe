services:
  - type: web
    name: tegaru-line-bot
    runtime: docker
    rootDir: bot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: OCR_ENGINE
        value: auto
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OCR_MODEL
        value: claude-sonnet-5-5
      - key: DATABASE_URL
        fromDatabase:
          name: jsaas-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: PANEL_URL
        value: https://jsaas-panel.onrender.com
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
  - type: web
    name: jsaas-panel
    runtime: static
    rootDir: dashboard-next
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://tegaru-line-bot.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: jsaas-db
    plan: free
    region: singapore
    databaseName: tegaru
    user: tegaru

services:
  - type: web
    name: tegaru-line-bot
    runtime: python
    rootDir: bot
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OCR_MODEL
        value: claude-sonnet-5-5
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: PANEL_URL
        value: https://jsaas-panel.onrender.com
  - type: web
    name: jsaas-panel
    runtime: static
    rootDir: dashboard-next
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://tegaru-line-bot.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

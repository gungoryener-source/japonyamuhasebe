services:
  - type: web
    name: tegaru-line-bot
    runtime: docker
    rootDir: bot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: OCR_ENGINE
        value: tesseract   # レシートは AI なし（Q-02）。AI は 仕切書・通帳のみ（ANTHROPIC_API_KEY）
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OCR_MODEL
        value: claude-sonnet-5-5
      - key: DATABASE_URL
        fromDatabase:
          name: jsaas-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: PANEL_URL
        value: https://jsaas-panel.onrender.com
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: NTA_APP_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PERSONAL
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      # Fiş görselleri (T-011, Q-14): Cloudflare R2. Dört değer de girilince S3 sürücüsü açılır; yoksa yerel disk.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
  - type: web
    name: jsaas-panel
    runtime: static
    rootDir: dashboard-next
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://tegaru-line-bot.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # 特定商取引法に基づく表記 / 規約の販売業者情報 (T-043, Q-12). Boşsa sayfada 「要確認」. Değişince yeniden derleme gerekir.
      - key: NEXT_PUBLIC_LEGAL_SELLER
        sync: false
      - key: NEXT_PUBLIC_LEGAL_MANAGER
        sync: false
      - key: NEXT_PUBLIC_LEGAL_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_LEGAL_PHONE
        sync: false
      - key: NEXT_PUBLIC_LEGAL_EMAIL
        sync: false
      # 公式LINE 友だち追加 URL (T-044, /lp). https://lin.ee/… veya https://line.me/… ; boşsa düğme gizli.
      - key: NEXT_PUBLIC_LINE_ADD_URL
        sync: false

databases:
  - name: jsaas-db
    plan: free
    region: singapore
    databaseName: tegaru
    user: tegaru
